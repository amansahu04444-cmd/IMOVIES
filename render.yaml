# ==============================================================================
# IMovies — Render Blueprint Deployment Specification
# ==============================================================================
# Documentation: https://render.com/docs/blueprint-spec
# To deploy, connect your GitHub repository in Render and create a new Blueprint.

services:
  # ----------------------------------------------------------------------------
  # 1. Backend REST API Service
  # ----------------------------------------------------------------------------
  - type: web
    name: imovies-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm --prefix Server install
    startCommand: npm --prefix Server start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGODB_URI
        sync: false # Set in Render Dashboard: your MongoDB Atlas cluster connection string
      - key: JWT_SECRET
        generateValue: true # Render automatically generates a secure 256-bit random key
      - key: CLIENT_URL
        sync: false # Set in Render Dashboard: e.g. https://imovies-web.onrender.com
      - key: ADMIN_NAME
        value: System Administrator
      - key: ADMIN_EMAIL
        value: admin@imovies.com
      - key: ADMIN_PASSWORD
        sync: false # Set in Render Dashboard: secure admin password (min 6 chars)

  # ----------------------------------------------------------------------------
  # 2. Frontend React Single Page Application (Static Site)
  # ----------------------------------------------------------------------------
  - type: web
    name: imovies-web
    runtime: static
    plan: free
    region: oregon
    buildCommand: npm --prefix Client install && npm --prefix Client run build
    staticPublishPath: ./Client/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false # Set to backend API URL: e.g. https://imovies-api.onrender.com/api
      - key: VITE_ENABLE_DEV_DEMO_LOGINS
        value: false
